# Unit guide — specs/intents/{intent}/units/{unit}/guide.yaml
# Written by sk.design (Phase 5). Tells agents WHERE this unit's code lives while the unit is active;
# knowledge-base.md tells WHY. It freezes with the unit at ship. The system-wide map of contexts is
# specs/domain/bounded-contexts.md — there is no system or domain guide.
#
# Per-entry limit: max 3 lines (summary + file + also-check).
#
# tier: unit
# unit: {unit-id}
# last-updated: YYYY-MM-DD
#
# modules:
#   {module-name}:
#     summary: "What this module/file handles."
#     file: "{relative path to the file}"
#     also-check: "Related modules, contracts or rules a change here must respect."
